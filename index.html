<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIT ROUTINE — Personal Workout Planner</title>
<style>
:root{--bg:#f4f6f3;--panel:#fff;--ink:#17251f;--muted:#718078;--line:#e4eae5;--green:#287a58;--green2:#e5f2ea;--lime:#c7e6a4;--orange:#f3a65b;--shadow:0 12px 35px rgba(24,52,37,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1120px;margin:auto;padding:24px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.brand{display:flex;gap:11px;align-items:center;font-weight:850;letter-spacing:.08em}.logo{width:38px;height:38px;border-radius:13px;background:#1d4936;color:white;display:grid;place-items:center;font-size:19px}.tag{font-size:11px;color:var(--green);background:var(--green2);padding:7px 10px;border-radius:30px;font-weight:750}.hero{background:linear-gradient(115deg,#173c2d,#2c7553);color:white;border-radius:25px;padding:27px;display:grid;grid-template-columns:1.4fr .8fr;gap:20px;box-shadow:var(--shadow)}.eyebrow{font-size:11px;letter-spacing:.14em;color:#c3ddca;font-weight:800}.hero h1{font-size:clamp(27px,4vw,42px);margin:12px 0 9px;letter-spacing:-.04em}.hero p{color:#d3e5d8;line-height:1.6;margin:0;max-width:510px}.hero-stat{align-self:center;justify-self:end;background:#ffffff16;border:1px solid #ffffff22;border-radius:18px;padding:18px 22px;min-width:180px}.hero-stat strong{font-size:30px;display:block;margin:6px 0}.hero-stat span{font-size:12px;color:#d3e5d8}.layout{display:grid;grid-template-columns:310px 1fr;gap:20px;margin-top:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}h2{font-size:17px;margin:0 0 16px}.field{margin:13px 0}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fbfcfb;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:var(--green)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{width:100%;padding:13px 16px;border-radius:12px;background:var(--green);color:#fff;font-weight:800;margin-top:9px}.primary:hover{background:#1e6447}.secondary{padding:9px 12px;border-radius:10px;background:var(--green2);color:var(--green);font-weight:750}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.tab{background:#f0f4f0;color:var(--muted);padding:9px 13px;border-radius:30px;font-size:12px;font-weight:750}.tab.active{background:#1d4936;color:white}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section-head h2{margin:0}.daylist{display:grid;gap:10px}.day{border:1px solid var(--line);border-radius:15px;padding:14px}.daytop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.dayname{font-weight:850}.daymeta{font-size:11px;color:var(--muted)}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#edf4ee;color:#3c7154;border-radius:7px;padding:5px 8px;font-size:11px;font-weight:700}.rest{color:var(--muted);font-size:12px;padding:7px 0}.exercise{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border:0}.exercise strong{display:block;font-size:13px}.exercise small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.prescription{font-size:12px;font-weight:800;color:var(--green);white-space:nowrap}.hint{background:#f4f8f4;border-radius:12px;padding:12px;color:#587061;font-size:12px;line-height:1.6;margin-top:14px}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.metric{background:#f5f8f5;border-radius:13px;padding:13px}.metric span{display:block;color:var(--muted);font-size:10px}.metric strong{display:block;font-size:20px;margin-top:5px}.logrow{display:grid;grid-template-columns:1fr 75px 75px 65px;gap:7px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.logrow input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}.logrow button{background:var(--green2);color:var(--green);border-radius:8px;padding:8px;font-weight:800}.empty{color:var(--muted);font-size:13px;padding:20px;text-align:center}.smallnote{font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#173c2d;color:white;padding:12px 17px;border-radius:30px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(max-width:760px){.layout{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero-stat{justify-self:start}.app{padding:16px 12px 40px}.panel{padding:16px}.logrow{grid-template-columns:1fr 62px 62px 58px}.top{margin-bottom:15px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">✦</div><span>FIT ROUTINE</span></div><span class="tag">PERSONAL WORKOUT AI</span></header>
<section class="hero"><div><div class="eyebrow">YOUR TRAINING, YOUR PACE</div><h1>꾸준함을 설계하고,<br>성장을 기록하세요.</h1><p>목표와 운동 경험에 맞춰 주간 루틴을 생성하고, 수행 기록을 바탕으로 다음 운동의 중량·반복 목표를 조정합니다.</p></div><div class="hero-stat"><span>이번 주 운동 완료</span><strong id="weekCount">0회</strong><span>기록을 남기면 여기에 반영돼요.</span></div></section>
<div class="layout">
<aside class="panel">
<h2>나의 운동 프로필</h2>
<div class="field"><label for="goal">운동 목표</label><select id="goal"><option value="hypertrophy">근비대 (근육량 증가)</option><option value="strength">근력 향상</option><option value="fatloss">체지방 감량</option><option value="general">체력·건강 유지</option></select></div>
<div class="field"><label for="level">운동 경력</label><select id="level"><option value="beginner">초급 (1년 미만)</option><option value="intermediate">중급 (1~3년)</option><option value="advanced">고급 (3년 이상)</option></select></div>
<div class="two"><div class="field"><label for="days">주당 운동 횟수</label><select id="days"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div><div class="field"><label for="minutes">1회 운동 시간</label><select id="minutes"><option>30</option><option>45</option><option selected>60</option><option>75</option><option>90</option></select></div></div>
<div class="field"><label for="place">운동 장소</label><select id="place"><option value="gym">헬스장</option><option value="home">홈트레이닝 (덤벨·밴드)</option><option value="body">맨몸 운동</option></select></div>
<div class="field"><label for="focus">우선 강화 부위</label><select id="focus"><option value="balanced">전체 균형</option><option value="chest">가슴</option><option value="back">등</option><option value="shoulder">어깨</option><option value="legs">하체</option></select></div>
<button class="primary" id="generate">✦ 내 루틴 생성하기</button>
<div class="smallnote">추천은 운동 원칙을 적용한 규칙 기반 알고리즘입니다. 의료적 진단이나 실제 생성형 AI의 판단은 아니며, 운동 기록에 따라 목표를 점진적으로 조정합니다.</div>
</aside>
<main class="panel">
<div class="tabs"><button class="tab active" data-tab="routine">주간 루틴</button><button class="tab" data-tab="today">오늘 운동</button><button class="tab" data-tab="history">운동 기록</button></div>
<div id="routineView"></div><div id="todayView" hidden></div><div id="historyView" hidden></div>
</main>
</div>
</div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const db={
gym:{
push:[['바벨 벤치프레스','가슴','복합'],['인클라인 덤벨 프레스','가슴','복합'],['케이블 플라이','가슴','고립'],['케이블 푸시다운','삼두','고립'],['덤벨 오버헤드 익스텐션','삼두','고립']],
pull:[['랫풀다운','등','복합'],['시티드 케이블 로우','등','복합'],['원암 덤벨 로우','등','복합'],['페이스풀','후면 어깨','고립'],['덤벨 컬','이두','고립']],
legs:[['바벨 스쿼트','하체','복합'],['루마니안 데드리프트','햄스트링','복합'],['레그 프레스','하체','복합'],['레그 컬','햄스트링','고립'],['카프 레이즈','종아리','고립']],
shoulder:[['덤벨 숄더프레스','어깨','복합'],['사이드 레터럴 레이즈','측면 어깨','고립'],['리어 델트 플라이','후면 어깨','고립'],['페이스풀','후면 어깨','고립'],['플랭크','코어','코어']]},
home:{
push:[['푸시업','가슴','복합'],['덤벨 플로어 프레스','가슴','복합'],['덤벨 플라이','가슴','고립'],['덤벨 킥백','삼두','고립']],
pull:[['원암 덤벨 로우','등','복합'],['밴드 랫풀다운','등','복합'],['덤벨 리버스 플라이','후면 어깨','고립'],['덤벨 컬','이두','고립']],
legs:[['고블릿 스쿼트','하체','복합'],['덤벨 루마니안 데드리프트','햄스트링','복합'],['리버스 런지','하체','복합'],['글루트 브리지','둔근','고립']],
shoulder:[['덤벨 숄더프레스','어깨','복합'],['사이드 레터럴 레이즈','측면 어깨','고립'],['리어 델트 플라이','후면 어깨','고립'],['플랭크','코어','코어']]},
body:{
push:[['푸시업','가슴','복합'],['무릎 푸시업','가슴','복합'],['다이아몬드 푸시업','삼두','고립']],
pull:[['백팩 로우','등','복합'],['수건 등척성 로우','등','복합'],['리버스 스노우 엔젤','후면 어깨','고립']],
legs:[['맨몸 스쿼트','하체','복합'],['리버스 런지','하체','복합'],['싱글 레그 글루트 브리지','둔근','고립'],['카프 레이즈','종아리','고립']],
shoulder:[['파이크 푸시업','어깨','복합'],['프론트 레이즈 (물병)','전면 어깨','고립'],['리버스 스노우 엔젤','후면 어깨','고립'],['플랭크','코어','코어']]}
};
let plan=JSON.parse(localStorage.getItem('fitPlan')||'null');
let logs=JSON.parse(localStorage.getItem('fitLogs')||'[]');
let activeDay=0;
const dayNames=['월요일','화요일','수요일','목요일','금요일','토요일','일요일'];
function profile(){return {goal:$('goal').value,level:$('level').value,days:+$('days').value,minutes:+$('minutes').value,place:$('place').value,focus:$('focus').value}}
function makePlan(p){
let splits;
if(p.days===2)splits=[['전신',['push','pull','legs','shoulder']],['전신',['legs','pull','push','shoulder']]];
else if(p.days===3)splits=[['전신',['push','pull','legs','shoulder']],['전신',['pull','legs','shoulder','push']],['전신',['legs','push','pull','shoulder']]];
else if(p.days===4)splits=[['상체 A',['push','pull']],['하체 A',['legs','shoulder']],['상체 B',['pull','push']],['하체 B',['legs','shoulder']]];
else if(p.days===5)splits=[['가슴·삼두',['push']],['등·이두',['pull']],['하체',['legs']],['어깨·코어',['shoulder']],['전신 보완',['push','pull','legs']]];
else splits=[['푸시',['push']],['풀',['pull']],['하체',['legs']],['푸시',['push']],['풀',['pull']],['하체',['legs']]];
let days=Array.from({length:7},(_,i)=>({name:dayNames[i],title:'휴식',keys:[]}));
let positions=p.days===2?[0,3]:p.days===3?[0,2,4]:p.days===4?[0,1,3,5]:p.days===5?[0,1,2,4,5]:[0,1,2,3,4,5];
splits.forEach((s,i)=>days[positions[i]]={name:dayNames[positions[i]],title:s[0],keys:s[1]});
return {profile:p,days,created:new Date().toISOString()};
}
function chooseExercises(keys,p){
let all=[];keys.forEach(k=>all.push(...db[p.place][k]));
let seen=new Set();all=all.filter(x=>{if(seen.has(x[0]))return false;seen.add(x[0]);return true});
if(p.focus!=='balanced'){const map={chest:'가슴',back:'등',shoulder:'어깨',legs:'하체'};all.sort((a,b)=>(b[1].includes(map[p.focus])?1:0)-(a[1].includes(map[p.focus])?1:0))}
let max=p.minutes<=30?3:p.minutes<=45?4:5;
return all.slice(0,max).map((e,i)=>({name:e[0],muscle:e[1],type:e[2],sets:p.level==='beginner'?2:p.level==='intermediate'?3:4,reps:p.goal==='strength'?(e[2]==='복합'?'4~6':'8~12'):p.goal==='fatloss'?'10~15':e[2]==='복합'?'6~12':'10~15',rest:e[2]==='복합'?'120초':'60~90초'}));
}
function renderRoutine(){
if(!plan){$('routineView').innerHTML='<div class="empty">왼쪽에서 운동 정보를 입력하고<br>「내 루틴 생성하기」를 눌러주세요.</div>';return}
let html='<div class="section-head"><h2>나의 주간 운동 계획</h2><button class="secondary" id="regen">다시 생성</button></div><div class="daylist">';
plan.days.forEach((d,i)=>{let ex=chooseExercises(d.keys,plan.profile);html+=`<div class="day"><div class="daytop"><span class="dayname">${d.name} · ${d.title}</span><span class="daymeta">${ex.length?ex.length+'개 종목':'회복'}</span></div>${ex.length?'<div class="chips">'+ex.map(e=>`<span class="chip">${e.name}</span>`).join('')+'</div>':'<div class="rest">휴식 및 가벼운 회복 활동</div>'}</div>`});
html+='</div><div class="hint">추천 기준: 운동 빈도와 경력에 따라 분할·세트 수를 조정했습니다. 첫 1~2주는 무리하지 않고 동작과 적정 중량을 익히세요.</div>';
$('routineView').innerHTML=html;$('regen').onclick=()=>{plan=makePlan(profile());save();renderRoutine();toast('루틴을 새로 구성했어요.')};
}
function todayIndex(){let d=new Date().getDay();return (d+6)%7}
function renderToday(){
if(!plan){$('todayView').innerHTML='<div class="empty">먼저 나의 루틴을 생성해주세요.</div>';return}
let idx=todayIndex(),d=plan.days[idx],ex=chooseExercises(d.keys,plan.profile);
if(!ex.length){$('todayView').innerHTML=`<h2>${d.name} · ${d.title}</h2><div class="empty">오늘은 회복하는 날이에요. 가벼운 걷기나 스트레칭을 해보세요.</div>`;return}
$('todayView').innerHTML=`<div class="section-head"><h2>${d.name} · ${d.title}</h2><span class="tag">${plan.profile.minutes}분 목표</span></div><div class="hint">권장 반복 횟수와 휴식 시간을 참고하되, 통증이 생기면 즉시 중단하세요. 세트마다 기록을 저장할 수 있어요.</div>`+ex.map((e,i)=>`<div class="exercise"><div><strong>${i+1}. ${e.name}</strong><small>${e.muscle} · ${e.sets}세트 · ${e.reps}회 · 휴식 ${e.rest}</small></div><span class="prescription">RPE 7~8</span></div>`).join('')+`<h2 style="margin-top:20px">오늘 운동 기록</h2><div class="logrow" style="font-weight:800;color:#718078"><span>운동</span><span>중량 kg</span><span>횟수</span><span></span></div>`+ex.map(e=>`<div class="logrow"><span>${e.name}</span><input type="number" min="0" step="0.5" placeholder="kg" id="w-${slug(e.name)}"><input type="number" min="1" placeholder="회" id="r-${slug(e.name)}"><button data-log="${encodeURIComponent(e.name)}">저장</button></div>`).join('');
document.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>{let name=decodeURIComponent(b.dataset.log),w=+$('w-'+slug(name)).value,r=+$('r-'+slug(name)).value;if(!r){toast('반복 횟수를 입력해주세요.');return}logs.unshift({date:new Date().toISOString(),name,weight:w,reps:r});localStorage.setItem('fitLogs',JSON.stringify(logs));toast('운동 기록을 저장했어요.');renderHistory();updateCount()});
}
function slug(s){return btoa(unescape(encodeURIComponent(s))).replace(/=/g,'')}
function renderHistory(){
if(!logs.length){$('historyView').innerHTML='<div class="empty">아직 저장된 운동 기록이 없어요.</div>';return}
let best={};logs.forEach(l=>{if(!best[l.name]||l.weight>best[l.name].weight)best[l.name]=l});
$('historyView').innerHTML=`<h2>운동 기록 요약</h2><div class="metric-grid"><div class="metric"><span>전체 기록</span><strong>${logs.length}</strong></div><div class="metric"><span>기록한 종목</span><strong>${Object.keys(best).length}</strong></div><div class="metric"><span>최근 기록</span><strong>${new Date(logs[0].date).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})}</strong></div></div><h2 style="margin-top:20px">최근 수행 기록</h2>`+logs.slice(0,30).map(l=>`<div class="exercise"><div><strong>${l.name}</strong><small>${new Date(l.date).toLocaleString('ko-KR')}</small></div><span class="prescription">${l.weight||0}kg × ${l.reps}회</span></div>`).join('')+`<button class="secondary" id="clearLogs" style="margin-top:14px">기록 전체 삭제</button>`;
$('clearLogs').onclick=()=>{if(confirm('모든 운동 기록을 삭제할까요?')){logs=[];localStorage.setItem('fitLogs','[]');renderHistory();updateCount()}};
}
function save(){localStorage.setItem('fitPlan',JSON.stringify(plan))}
function updateCount(){let now=new Date(),start=new Date(now);start.setDate(now.getDate()-((now.getDay()+6)%7));start.setHours(0,0,0,0);let n=logs.filter(l=>new Date(l.date)>=start).length;$('weekCount').textContent=n+'회'}
function toast(t){let el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1900)}
$('generate').onclick=()=>{plan=makePlan(profile());save();renderRoutine();renderToday();toast('나에게 맞는 주간 루틴을 만들었어요.')};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));['routine','today','history'].forEach(t=>$(t+'View').hidden=t!==b.dataset.tab);if(b.dataset.tab==='today')renderToday();if(b.dataset.tab==='history')renderHistory()});
if(plan){let p=plan.profile;Object.keys(p).forEach(k=>{if($(k))$(k).value=p[k]});renderRoutine()}else renderRoutine();renderHistory();updateCount();
</script>
</body></html>
